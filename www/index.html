<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58cc02">
<meta name="color-scheme" content="light dark">
<title>Chispa</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="wrap">
      <div class="logo"><span id="logoMascot"></span><span class="wordmark">chispa</span></div>
      <div class="stats">
        <span class="stat" id="stStreak" role="status"></span>
        <span class="stat" id="stXp" role="status"></span>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero" aria-label="Bienvenida">
      <span id="heroMascot"></span>
      <div class="bubble">
        <h1 id="heroTitle"></h1>
        <p id="heroText"></p>
        <div class="total" role="progressbar" aria-label="Progreso total" aria-valuemin="0" aria-valuemax="100" id="totalBar"><i id="totalFill"></i></div>
      </div>
    </section>

    <section id="path" aria-label="Camino de lecciones"></section>
  </main>

  <footer class="wrap foot">
    <p>Español y Literatura · 9.º grado</p>
    <button type="button" id="reset">Reiniciar progreso</button>
  </footer>
</div>

<div class="lesson" id="lesson" role="dialog" aria-modal="true" aria-label="Lección" hidden>
  <header class="lh">
    <button type="button" class="x" id="lx" aria-label="Salir de la lección"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    <div class="bar" role="progressbar" aria-label="Progreso de la lección" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="barWrap"><i id="barFill"></i></div>
    <div class="hearts" id="lhearts" aria-live="polite"></div>
  </header>
  <div class="lbody" id="lbody"><div class="in" id="lin"></div></div>
  <footer class="lfoot" id="lfoot">
    <div class="lfoot-in">
      <div class="fb" id="fb" aria-live="assertive"></div>
      <button type="button" class="btn" id="lbtn" disabled>Comprobar</button>
    </div>
  </footer>
  <div class="sheet" id="quit" hidden>
    <div class="sheet-in" role="alertdialog" aria-labelledby="quitT">
      <span id="quitMascot"></span>
      <h3 id="quitT">¿Seguro que quieres salir?</h3>
      <p>Si sales ahora, pierdes el avance de esta lección.</p>
      <button type="button" class="btn" id="stay">Seguir aprendiendo</button>
      <button type="button" class="btn ghost" id="leave">Salir</button>
    </div>
  </div>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status" hidden></div>

<script src="js/data/helpers.js"></script>
<script src="js/data/cap1.js"></script>
<script src="js/data/cap2.js"></script>
<script src="js/data/cap3.js"></script>
<script src="js/data/cap4.js"></script>
<script src="js/data/cap5.js"></script>
<script src="js/data/cap6.js"></script>
<script src="js/app.js"></script>
</body>
</html>
